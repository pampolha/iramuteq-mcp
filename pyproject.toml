[project]
name = "iramuteq-mcp"
version = "1.0.0"
description = "MCP server exposing IRaMuTeQ 0.8 as a headless analysis interface (thin facade over the IRaMuTeQ sources)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.0",
    "xlrd>=2.0.1",
]

[project.scripts]
iramuteq-mcp = "iramuteq_mcp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
markers = [
    "requires_r: needs R with the IRaMuTeQ packages; skipped when unavailable",
    "slow: long R runs (minutes)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# UP031 (percent formatting) is kept deliberately: the ported IRaMuTeQ code uses it throughout.
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["UP031"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
